<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum — game and marrow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #F4EDE0;
    color: #2B2622;
    font-family: 'Cormorant Garamond', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  .logo {
    width: 340px;
    max-width: 80vw;
    height: auto;
    display: block;
    margin: 0 auto 2.5rem;
  }
  a {
    color: #2B2622;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-bottom: 1px solid rgba(43,38,34,0.35);
    padding-bottom: 2px;
  }
  a:hover {
    border-bottom-color: #2B2622;
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Ossum — game and marrow">
    <a href="mailto:hello@ossum.london">hello@ossum.london</a>
  </main>
</body>
</html>
