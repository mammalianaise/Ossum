<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
  }

  body {
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background: var(--background);
  }

  .left-column {
    position: absolute;
    z-index: 2;
    top: 7%;
    bottom: 7%;
    left: 7%;
    width: 42%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }

  .wordmark {
    display: block;
    width: min(100%, 520px);
    height: auto;
  }

  .description {
    max-width: 500px;
    margin: 0;
    color: var(--cream);
    font-family: "Libre Baskerville", Baskerville, Georgia, serif;
    font-size: clamp(1.35rem, 2.25vw, 2rem);
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: -.015em;
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.5rem, 2.8vw, 2.25rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.12;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  .rabbit {
    position: absolute;
    z-index: 1;
    top: 18%;
    right: 3%;
    width: min(51vw, 760px);
    height: auto;
  }

  @media (max-width: 700px) {
    .left-column {
      top: 5%;
      right: 7%;
      bottom: 6%;
      left: 7%;
      width: auto;
    }

    .wordmark {
      width: 68%;
    }

    .description {
      max-width: 58%;
      font-size: clamp(1.2rem, 5.5vw, 1.65rem);
      line-height: 1.25;
    }

    .contact {
      font-size: clamp(1.35rem, 6.2vw, 1.8rem);
    }

    .rabbit {
      top: 26%;
      right: -17%;
      width: 102%;
    }
  }
</style>
</head>

<body>
  <main class="page">

    <section class="left-column">

      <svg
        class="wordmark"
        viewBox="380 990 1440 670"
        role="img"
        aria-label="Ossum — game and marrow"
        preserveAspectRatio="xMidYMid meet">
        <image
          href="logo.png"
          x="0"
          y="0"
          width="2000"
          height="2000">
        </image>
      </svg>

      <p class="description">Game pâté and pie filling.</p>

      <address class="contact">
        <a href="tel:+447955822097">07955 822097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>

    </section>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

  </main>
</body>
</html>
