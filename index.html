<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum — Game and Marrow</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #747773;
    --card: #5f625f;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.035), transparent 32%),
      radial-gradient(circle at 80% 75%, rgba(0,0,0,.05), transparent 38%),
      var(--background);
    color: var(--cream);
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(760px, 100%);
    min-height: 480px;
    padding: 70px 55px 55px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(237, 232, 219, .72);
    box-shadow:
      inset 0 0 0 7px var(--card),
      inset 0 0 0 8px rgba(237, 232, 219, .22),
      0 24px 65px rgba(24, 26, 24, .2);
  }

  .logo {
    display: block;
    width: 280px;
    max-width: 72%;
    height: auto;
  }

  .identity {
    margin: 45px 0;
  }

  .rule {
    width: 45px;
    height: 1px;
    margin: 0 auto 24px;
    background: var(--orange);
  }

  .product {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.55rem, 4vw, 2rem);
    font-weight: 400;
    letter-spacing: .025em;
  }

  .location {
    margin: 13px 0 0;
    font-size: .68rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    opacity: .72;
  }

  .contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-size: .82rem;
    letter-spacing: .04em;
  }

  .contact span {
    color: var(--orange);
  }

  a {
    color: var(--cream);
    text-decoration: none;
    border-bottom: 1px solid rgba(237, 232, 219, .3);
    padding-bottom: 3px;
  }

  a:hover,
  a:focus {
    color: var(--orange);
    border-bottom-color: var(--orange);
  }

  @media (max-width: 560px) {
    body {
      padding: 14px;
    }

    .card {
      min-height: calc(100svh - 28px);
      padding: 65px 28px 45px;
    }

    .contact {
      flex-direction: column;
      gap: 13px;
    }

    .contact span {
      display: none;
    }
  }
</style>
</head>

<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Ossum — game and marrow">

    <div class="identity">
      <div class="rule"></div>
      <p class="product">Rabbit &amp; marrow pâté</p>
      <p class="location">London</p>
    </div>

    <div class="contact">
      <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      <span>·</span>
      <a href="tel:+447955822097">07955 822097</a>
    </div>
  </main>
</body>
</html>
