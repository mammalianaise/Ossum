<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
  }

  body {
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background: var(--background);
  }

  .left-column {
    position: absolute;
    z-index: 2;
    top: 7%;
    bottom: 7%;
    left: 7%;
    width: 42%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }

  .wordmark {
    display: block;
    width: min(100%, 520px);
    height: auto;
  }

  .description {
    max-width: 500px;
    margin: 0;
    color: var(--cream);
    font-family: "Libre Baskerville", Baskerville, Georgia, serif;
    font-size: clamp(1.35rem, 2.25vw, 2rem);
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: -.015em;
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.5rem, 2.8vw, 2.25rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.12;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  .rabbit {
    position: absolute;
    z-index: 1;
    top: 18%;
    right: 3%;
    width: min(51vw, 760px);
    height: auto;
  }

  @media (max-width: 700px) {
    .left-column {
      top: 5%;
      right: 7%;
      bottom: 6%;
      left: 7%;
      width: auto;
    }

    .wordmark {
      width: 68%;
    }

    .description {
      max-width: 58%;
      font-size: clamp(1.2rem, 5.5vw, 1.65rem);
      line-height: 1.25;
    }

    .contact {
      font-size: clamp(1.35rem, 6.2vw, 1.8rem);
    }

    .rabbit {
      top: 26%;
      right: -17%;
      width: 102%;
    }
  }

  .product-intro { width: 100%; }
  .product-button {
    margin-top: 1.15rem;
    padding: .65rem 1rem;
    border: 1px solid rgba(237,232,219,.55);
    border-radius: 999px;
    background: transparent;
    color: var(--cream);
    font: 400 .85rem "Libre Baskerville", Georgia, serif;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .product-button:hover { background: var(--cream); color: var(--background); }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 5px; }
  .product-dialog {
    padding: 0;
    border: 0;
    border-radius: 14px;
    width: min(860px, calc(100vw - 32px));
    max-height: calc(100svh - 32px);
    overflow: hidden;
    background: var(--background);
    box-shadow: 0 24px 100px rgba(0,0,0,.4);
  }
  .product-dialog[open] { animation: photo-open .25s ease-out; }
  .product-dialog::backdrop { background: rgba(24,28,27,.75); backdrop-filter: blur(5px); }
  .product-dialog img {
    display: block;
    width: 100%;
    max-height: calc(100svh - 32px);
    object-fit: contain;
  }
  .product-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(237,232,219,.5);
    border-radius: 50%;
    background: rgba(45,49,48,.85);
    color: var(--cream);
    font: 300 30px/1 Georgia, serif;
    cursor: pointer;
  }
  .product-close:hover { background: var(--background); }
  @keyframes photo-open {
    from { opacity: 0; transform: scale(.94) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .product-dialog[open] { animation: none; }
    .product-button { transition: none; }
  }
</style>
</head>

<body>
  <main class="page">

    <section class="left-column">

      <svg
        class="wordmark"
        viewBox="380 990 1440 670"
        role="img"
        aria-label="Ossum — game and marrow"
        preserveAspectRatio="xMidYMid meet">
        <image
          href="logo.png"
          x="0"
          y="0"
          width="2000"
          height="2000">
        </image>
      </svg>

      <div class="product-intro">
        <p class="description">Game pâté and pie filling.</p>
        <button class="product-button" type="button" aria-haspopup="dialog" aria-controls="product-photo">See product</button>
      </div>

      <address class="contact">
        <a href="tel:+447955822097">07955 822 097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>

    </section>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

  </main>
  <dialog class="product-dialog" id="product-photo" aria-label="Ossum game pâté">
    <button class="product-close" type="button" aria-label="Close product photo" autofocus>×</button>
    <img src="IMG_0029.jpeg" alt="Ossum game pâté, showing a cut portion and the whole terrine on wrapping paper">
  </dialog>
  <script>
    const productButton = document.querySelector('.product-button');
    const productDialog = document.querySelector('.product-dialog');
    productButton.addEventListener('click', () => productDialog.showModal());
    document.querySelector('.product-close').addEventListener('click', () => productDialog.close());
    productDialog.addEventListener('click', (event) => {
      const bounds = productDialog.getBoundingClientRect();
      if (event.target === productDialog &&
          (event.clientX < bounds.left || event.clientX > bounds.right ||
           event.clientY < bounds.top || event.clientY > bounds.bottom)) {
        productDialog.close();
      }
    });
    productDialog.addEventListener('close', () => productButton.focus());
  </script>
</body>
</html>
