<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #6B6E6B;
    --text: #EDE9DF;
    --accent: #F5A93F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 10vh 24px;
  }

  main {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .logo {
    width: 240px;
    max-width: 70%;
    height: auto;
    display: block;
    margin: 0 auto 3.5rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 1.9rem;
    line-height: 1.4;
    letter-spacing: 0.01em;
    margin: 0 0 1.75rem;
  }

  p {
    font-size: 1rem;
    line-height: 1.85;
    margin: 0;
    opacity: 0.9;
  }

  .contact {
    margin-top: 4rem;
    font-size: 1rem;
    line-height: 2.2;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(245,169,63,0.35);
    padding-bottom: 1px;
  }

  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 4.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.45;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.6rem; }
    body { padding: 8vh 20px; }
  }
</style>
</head>
<body>
<main>

  <img class="logo" src="logo.png" alt="Ossum">

  <h1>The whole animal. All the organs. Reinforced with marrow.</h1>

  <p>Nothing is wasted and nothing is hidden.</p>

  <div class="contact">
    <a href="mailto:hello@ossum.london">hello@ossum.london</a><br>
    <a href="tel:+447955822097">07955 822097</a>
  </div>

  <footer>Ossum &middot; London</footer>

</main>
</body>
</html>
