<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --page: #747773;
    --card: #626562;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(1000px, 100%);
    aspect-ratio: 89 / 51;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 78% 42%,
        rgba(255, 255, 255, .035),
        transparent 42%
      ),
      var(--card);
    box-shadow: 0 20px 55px rgba(26, 28, 26, .19);
  }

  .content {
    position: absolute;
    z-index: 2;
    top: 11%;
    bottom: 10%;
    left: 8%;
    width: 48%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  h1 {
    margin: 0;
    color: var(--orange);
    font-size: clamp(4rem, 10vw, 7.8rem);
    font-weight: 400;
    line-height: .8;
    letter-spacing: -.025em;
  }

  .description {
    margin: 1.1em 0 0;
    max-width: 390px;
    color: var(--cream);
    font-size: clamp(1.35rem, 3.3vw, 2.3rem);
    font-weight: 400;
    line-height: 1.05;
  }

  .rule {
    width: 58px;
    height: 1px;
    margin-top: auto;
    margin-bottom: 20px;
    background: rgba(237, 232, 219, .65);
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: .08em;
    font-size: clamp(1rem, 2.3vw, 1.55rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.15;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  /*
    The existing logo contains the rabbit above the old wording.
    This window enlarges the image and displays only its upper half.
  */
  .rabbit {
    position: absolute;
    z-index: 1;
    top: 5%;
    right: -2%;
    width: 60%;
    height: 90%;
    overflow: hidden;
  }

  .rabbit img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 190%;
    object-fit: contain;
    object-position: center top;
    filter: contrast(1.05);
    opacity: .82;
  }

  @media (max-width: 650px) {
    body {
      padding: 10px;
    }

    .card {
      width: 100%;
      height: calc(100svh - 20px);
      min-height: 520px;
      aspect-ratio: auto;
    }

    .rabbit {
      top: 1%;
      right: -13%;
      width: 93%;
      height: 58%;
    }

    .content {
      top: 10%;
      right: 8%;
      bottom: 7%;
      left: 8%;
      width: auto;
    }

    h1 {
      font-size: clamp(4.2rem, 22vw, 6.5rem);
    }

    .description {
      margin-top: auto;
      font-size: clamp(1.7rem, 8vw, 2.4rem);
    }

    .rule {
      margin-top: 25px;
      margin-bottom: 16px;
    }

    .contact {
      font-size: clamp(1.15rem, 5.5vw, 1.55rem);
    }
  }
</style>
</head>

<body>
  <main class="card">
    <div class="rabbit" aria-hidden="true">
      <img src="logo.png" alt="">
    </div>

    <section class="content">
      <h1>Ossum</h1>

      <p class="description">Game pâté<br>and pie filling.</p>

      <div class="rule"></div>

      <address class="contact">
        <a href="tel:+447955822097">07955 822097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>
    </section>
  </main>
</body>
</html>
