<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --page: #747773;
    --card: #626562;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(1000px, 100%);
    aspect-ratio: 89 / 51;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 20px 55px rgba(26, 28, 26, .19);
  }

  .content {
    position: absolute;
    z-index: 2;
    top: 18%;
    bottom: 10%;
    left: 8%;
    width: 39%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .description {
    margin: 0;
    color: var(--cream);
    font-size: clamp(1.7rem, 4vw, 3rem);
    font-weight: 400;
    line-height: 1.03;
  }

  .rule {
    width: 58px;
    height: 1px;
    margin-top: auto;
    margin-bottom: 20px;
    background: rgba(237, 232, 219, .65);
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: .08em;
    font-size: clamp(1rem, 2.3vw, 1.55rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.15;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  .brand {
    position: absolute;
    z-index: 1;
    top: 4%;
    right: -2%;
    width: 62%;
    height: 92%;
    overflow: hidden;
  }

  .brand img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    display: block;
  }

  /* Covers only the old “game and marrow” line */
  .brand::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    left: 4%;
    height: 20%;
    background: var(--card);
  }

  @media (max-width: 650px) {
    body {
      padding: 10px;
    }

    .card {
      width: 100%;
      height: calc(100svh - 20px);
      min-height: 520px;
      aspect-ratio: auto;
    }

    .brand {
      top: 0;
      right: -18%;
      width: 105%;
      height: 62%;
    }

    .content {
      top: auto;
      right: 8%;
      bottom: 7%;
      left: 8%;
      width: auto;
    }

    .description {
      font-size: clamp(1.8rem, 8vw, 2.5rem);
    }

    .rule {
      margin-top: 30px;
      margin-bottom: 16px;
    }

    .contact {
      font-size: clamp(1.15rem, 5.5vw, 1.55rem);
    }
  }
</style>
</head>

<body>
  <main class="card">
    <section class="content">
      <p class="description">Game pâté<br>and pie filling.</p>

      <div class="rule"></div>

      <address class="contact">
        <a href="tel:+447955822097">07955 822097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>
    </section>

    <div class="brand">
      <img src="logo.png" alt="Ossum">
    </div>
  </main>
</body>
</html>
