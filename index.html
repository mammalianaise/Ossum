<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #747773;
    --card: #5f625f;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--cream);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(980px, 100%);
    aspect-ratio: 89 / 51;
    overflow: hidden;
    background: var(--card);
    border: 1px solid rgba(237, 232, 219, .18);
    box-shadow: 0 22px 55px rgba(24, 26, 24, .2);
  }

  .logo {
    position: absolute;
    top: 10%;
    left: 6%;
    width: 88%;
    height: 62%;
    object-fit: contain;
    object-position: center;
  }

  .contact {
    position: absolute;
    left: 7%;
    bottom: 10%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .2em;
    font-size: clamp(1rem, 2.5vw, 1.75rem);
    font-weight: 400;
    line-height: 1.15;
  }

  a {
    color: var(--orange);
    text-decoration: none;
  }

  a:hover,
  a:focus {
    color: var(--cream);
  }

  @media (max-width: 560px) {
    body {
      padding: 10px;
    }

    .contact {
      font-size: clamp(.82rem, 3.8vw, 1.15rem);
    }
  }
</style>
</head>

<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Ossum">

    <address class="contact">
      <a href="tel:+447955822097">07955 822097</a>
      <a href="mailto:hello@ossum.london">hello@ossum.london</a>
    </address>
  </main>
</body>
</html>
