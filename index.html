<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Cormorant+Infant:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --page: #747773;
    --card: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(1000px, 100%);
    aspect-ratio: 89 / 51;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 20px 55px rgba(26, 28, 26, .18);
  }

  /* Original Ossum wordmark with “game and marrow” */
  .wordmark {
    position: absolute;
    top: 10%;
    left: 6%;
    width: 39%;
    height: auto;
  }

  /* Rabbit taken from the original logo image */
  .rabbit {
    position: absolute;
    top: 20%;
    right: 5%;
    width: 48%;
    height: auto;
  }

  .description {
    position: absolute;
    top: 49%;
    left: 7%;
    margin: 0;
    color: var(--cream);
    font-family: "Cormorant Infant", Georgia, serif;
    font-size: clamp(1.15rem, 2.7vw, 1.9rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: .005em;
  }

  .contact {
    position: absolute;
    left: 7%;
    bottom: 14%;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1rem, 2.35vw, 1.55rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.15;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  @media (max-width: 650px) {
    body {
      padding: 10px;
    }

    .card {
      width: 100%;
      height: calc(100svh - 20px);
      min-height: 520px;
      aspect-ratio: auto;
    }

    .wordmark {
      top: 7%;
      left: 7%;
      width: 58%;
    }

    .rabbit {
      top: 25%;
      right: -8%;
      width: 86%;
    }

    .description {
      top: auto;
      bottom: 26%;
      left: 8%;
      font-size: clamp(1.45rem, 7vw, 2rem);
    }

    .contact {
      left: 8%;
      bottom: 8%;
      font-size: clamp(1.15rem, 5.5vw, 1.5rem);
    }
  }
</style>
</head>

<body>
  <main class="card">

    <svg
      class="wordmark"
      viewBox="300 990 1500 670"
      role="img"
      aria-label="Ossum — game and marrow"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <p class="description">Game pâté and pie filling.</p>

    <address class="contact">
      <a href="tel:+447955822097">07955 822 097</a>
      <a href="mailto:hello@ossum.london">hello@ossum.london</a>
    </address>

  </main>
</body>
</html>
