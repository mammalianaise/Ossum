<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Cormorant+Infant:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--background);
  }

  body {
    min-height: 100svh;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow: hidden;
    background: var(--background);
  }

  .wordmark {
    position: absolute;
    top: 8%;
    left: 7%;
    width: min(36vw, 520px);
    height: auto;
  }

  .rabbit {
    position: absolute;
    top: 15%;
    right: 5%;
    width: min(46vw, 690px);
    height: auto;
  }

  .details {
    position: absolute;
    top: 43%;
    left: 7%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .description {
    margin: 0;
    color: var(--cream);
    font-family: "Cormorant Infant", Georgia, serif;
    font-size: clamp(1.45rem, 2.4vw, 2.15rem);
    font-weight: 400;
    line-height: 1.1;
  }

  .contact {
    margin: clamp(38px, 5vw, 68px) 0 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.35rem, 2.5vw, 2rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.12;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  .pate-photo {
    position: absolute;
    right: 9%;
    bottom: 7%;
    width: min(18vw, 260px);
    height: auto;
    display: block;
    object-fit: cover;
  }

  @media (max-width: 700px) {
    .wordmark {
      top: 5%;
      left: 7%;
      width: 68%;
    }

    .rabbit {
      top: 24%;
      right: -12%;
      width: 92%;
    }

    .details {
      top: auto;
      right: 7%;
      bottom: 7%;
      left: 7%;
    }

    .description {
      max-width: 65%;
      font-size: clamp(1.4rem, 6.5vw, 1.9rem);
    }

    .contact {
      margin-top: 28px;
      font-size: clamp(1.3rem, 6vw, 1.7rem);
    }

    .pate-photo {
      right: 7%;
      bottom: 8%;
      width: 31%;
    }
  }
</style>
</head>

<body>
  <main class="page">

    <svg
      class="wordmark"
      viewBox="380 990 1440 670"
      role="img"
      aria-label="Ossum — game and marrow"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <section class="details">
      <p class="description">Game pâté and pie filling.</p>

      <address class="contact">
        <a href="tel:+447955822097">07955 822 097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>
    </section>

    <img
      class="pate-photo"
      src="IMG_0029.jpeg"
      alt="Ossum game pâté">

  </main>
</body>
</html>
