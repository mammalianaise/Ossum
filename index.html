<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Cormorant+Infant:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
  }

  body {
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background: var(--background);
  }

  /* Complete left-hand reading column */
  .left-column {
    position: absolute;
    z-index: 4;
    top: 7%;
    bottom: 7%;
    left: 7%;
    width: 39%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }

  .wordmark {
    display: block;
    width: min(100%, 520px);
    height: auto;
  }

  .description {
    margin: 0;
    color: var(--cream);
    font-family: "Cormorant Infant", Georgia, serif;
    font-size: clamp(1.5rem, 2.5vw, 2.25rem);
    font-weight: 400;
    line-height: 1.08;
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.45rem, 2.7vw, 2.15rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.12;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  /* Rabbit overlaps the photograph slightly */
  .rabbit {
    position: absolute;
    z-index: 3;
    top: 14%;
    right: 4%;
    width: min(46vw, 690px);
    height: auto;
  }

  /* Photograph anchored into the page rather than floating */
  .photo-wrap {
    position: absolute;
    z-index: 1;
    right: 0;
    bottom: 0;
    width: 42%;
    height: 43%;
    overflow: hidden;
  }

  .pate-photo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 55%;
    filter:
      grayscale(.62)
      saturate(.58)
      contrast(.94)
      brightness(.84);
    opacity: .8;
  }

  /* Fades the photograph into the grey background */
  .photo-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        to right,
        var(--background) 0%,
        rgba(98, 102, 102, .88) 8%,
        transparent 35%
      ),
      linear-gradient(
        to bottom,
        var(--background) 0%,
        rgba(98, 102, 102, .75) 10%,
        transparent 38%
      );
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .left-column {
      top: 5%;
      right: 7%;
      bottom: 6%;
      left: 7%;
      width: auto;
    }

    .wordmark {
      width: 68%;
    }

    .description {
      max-width: 58%;
      font-size: clamp(1.35rem, 6.4vw, 1.9rem);
    }

    .contact {
      font-size: clamp(1.3rem, 6vw, 1.7rem);
    }

    .rabbit {
      top: 25%;
      right: -16%;
      width: 98%;
    }

    .photo-wrap {
      width: 62%;
      height: 32%;
    }
  }
</style>
</head>

<body>
  <main class="page">

    <section class="left-column">

      <svg
        class="wordmark"
        viewBox="380 990 1440 670"
        role="img"
        aria-label="Ossum — game and marrow"
        preserveAspectRatio="xMidYMid meet">
        <image
          href="logo.png"
          x="0"
          y="0"
          width="2000"
          height="2000">
        </image>
      </svg>

      <p class="description">Game pâté and pie filling.</p>

      <address class="contact">
        <a href="tel:+447955822097">07955 822 097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>

    </section>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <div class="photo-wrap">
      <img
        class="pate-photo"
        src="IMG_0029.jpeg"
        alt="Ossum game pâté">
    </div>

  </main>
</body>
</html>
