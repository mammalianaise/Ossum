<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=IM+Fell+English&display=swap" rel="stylesheet">

<style>
  :root {
    --background: #626666;
    --cream: #ede8db;
    --orange: #f5a93f;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--background);
  }

  body {
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    background: var(--background);
  }

  .left-column {
    position: absolute;
    z-index: 4;
    top: 7%;
    bottom: 7%;
    left: 7%;
    width: 39%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }

  .wordmark {
    display: block;
    width: min(100%, 520px);
    height: auto;
  }

  .description {
    margin: 0;
    color: var(--cream);
    font-family: "IM Fell English", Georgia, serif;
    font-size: clamp(1.5rem, 2.6vw, 2.3rem);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: .01em;
  }

  .contact {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(1.45rem, 2.7vw, 2.15rem);
    font-weight: 400;
    font-style: normal;
    line-height: 1.12;
  }

  .contact a {
    color: var(--orange);
    text-decoration: none;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cream);
  }

  .rabbit {
    position: absolute;
    z-index: 3;
    top: 14%;
    right: 4%;
    width: min(46vw, 690px);
    height: auto;
  }

  /* Bold, tightly cropped product photograph */
  .photo-wrap {
    position: absolute;
    z-index: 2;
    left: 57%;
    bottom: 3%;
    width: min(32vw, 470px);
    height: min(34vh, 330px);
    overflow: hidden;
    transform: translateX(-50%);
  }

  .pate-photo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 43% 55%;
    filter:
      saturate(1.2)
      contrast(1.08)
      brightness(1.02);
    transform: scale(1.18);
  }

  @media (max-width: 700px) {
    .left-column {
      top: 5%;
      right: 7%;
      bottom: 6%;
      left: 7%;
      width: auto;
    }

    .wordmark {
      width: 68%;
    }

    .description {
      max-width: 58%;
      font-size: clamp(1.4rem, 6.5vw, 1.95rem);
    }

    .contact {
      font-size: clamp(1.3rem, 6vw, 1.7rem);
    }

    .rabbit {
      top: 24%;
      right: -16%;
      width: 98%;
    }

    .photo-wrap {
      left: 65%;
      bottom: 5%;
      width: 56%;
      height: 29%;
    }
  }
</style>
</head>

<body>
  <main class="page">

    <section class="left-column">

      <svg
        class="wordmark"
        viewBox="380 990 1440 670"
        role="img"
        aria-label="Ossum — game and marrow"
        preserveAspectRatio="xMidYMid meet">
        <image
          href="logo.png"
          x="0"
          y="0"
          width="2000"
          height="2000">
        </image>
      </svg>

      <p class="description">Game pâté and pie filling.</p>

      <address class="contact">
        <a href="tel:+447955822097">07955 822097</a>
        <a href="mailto:hello@ossum.london">hello@ossum.london</a>
      </address>

    </section>

    <svg
      class="rabbit"
      viewBox="450 330 1100 650"
      aria-hidden="true"
      preserveAspectRatio="xMidYMid meet">
      <image
        href="logo.png"
        x="0"
        y="0"
        width="2000"
        height="2000">
      </image>
    </svg>

    <div class="photo-wrap">
      <img
        class="pate-photo"
        src="IMG_0029.jpeg"
        alt="Ossum game pâté">
    </div>

  </main>
</body>
</html>
